name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}

          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          config.response_language: "ko-KR"
          config.max_model_tokens: "20000"

          # 테스트/설정 파일 스킵
          config.patch_extension_skip_types: '[".md", ".txt", ".xml", ".sql", ".yaml", ".yml"]'

          # 리뷰 항목 축소
          pr_reviewer.require_tests_review: "false"
          pr_reviewer.require_ticket_analysis_review: "false"
          pr_reviewer.num_max_findings: "3"

          # 코드 제안 개수 축소
          pr_code_suggestions.num_code_suggestions_per_chunk: "2"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'