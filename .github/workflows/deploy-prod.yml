name: Deploy (prod)

# ⚠️ 앱 심사 기간 한정 구성: 배포 대상은 신버전 컨테이너(app-v2)다.
# 구버전 앱 사용자가 쓰는 app 컨테이너는 기존 이미지로 동결하며 이 워크플로가 건드리지 않는다.
# 심사 통과·출시 후 구버전 컨테이너를 내리고 나면, 배포 대상을 다시 app 으로 되돌리거나
# app-v2 를 운영 컨테이너로 승격하는 정리 작업이 필요하다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 테스트 서버 배포(deploy-dev.yml)와 같은 그룹. 한 EC2 를 공유하므로 동시 실행을 막는다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod-latest
            type=sha,prefix=prod-,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./photo
          file: ./photo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy & verify (auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          # 심사 기간 동안 배포 대상은 신버전 컨테이너(app-v2)다.
          # 구버전 컨테이너(app)는 기존 이미지로 계속 떠 있어야 하므로 태그를 주지 않는다.
          V2_IMAGE_TAG: prod-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_PAT,V2_IMAGE_TAG
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_PATH }}/..
            git fetch origin main
            git checkout -B main FETCH_HEAD
            git reset --hard FETCH_HEAD
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # 롤백 대비: 현재 떠있는 컨테이너의 이미지 태그 캡쳐
            PREV_TAG=""
            if docker inspect photo-app-v2 >/dev/null 2>&1; then
              PREV_TAG=$(docker inspect photo-app-v2 --format '{{.Config.Image}}' | awk -F: '{print $NF}')
              echo "Previous image tag: $PREV_TAG"
            else
              echo "No previous container (first deploy)"
            fi

            health_check() {
              for i in $(seq 1 30); do
                if curl -fsSk -H 'Host: api.pickflow-api.us' https://localhost/healthz > /dev/null 2>&1; then
                  echo "Health check passed (attempt $i)"
                  return 0
                fi
                echo "Waiting... ($i/30)"
                sleep 5
              done
              return 1
            }

            # 새 이미지 배포
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.v2.yml pull app-v2
            docker compose -f docker-compose.yml -f docker-compose.v2.yml up -d app-v2 nginx

            if health_check; then
              # nginx 재시작 (git reset으로 inode가 교체된 conf 파일 반영)
              docker compose up -d --force-recreate nginx
              # 앱 배포 성공 후 모니터링 스택 동기화 (설정 변경 시 재시작, 신규 시 기동)
              docker compose up -d prometheus grafana loki promtail node-exporter
              docker image prune -f
              exit 0
            fi

            echo "Health check failed after 150s"
            if [ -z "$PREV_TAG" ]; then
              echo "No previous tag to rollback to"
              exit 1
            fi

            echo "Rolling back to: $PREV_TAG"
            export V2_IMAGE_TAG="$PREV_TAG"
            docker compose -f docker-compose.yml -f docker-compose.v2.yml up -d app-v2
            if health_check; then
              echo "Rollback successful — pipeline will still fail to flag the bad deploy"
            else
              echo "Rollback also failed — manual intervention required"
            fi
            exit 1
