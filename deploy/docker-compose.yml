name: photo

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: photo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - app_uploads:/var/www/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: ghcr.io/ddd-community/ddd-13-ioes-be:${APP_IMAGE_TAG:-dev-latest}
    container_name: photo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # test/prod 양쪽 yaml 이 같은 변수명을 읽도록 PROD_*/TEST_* 모두 주입
      PROD_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PROD_DB_USERNAME: ${POSTGRES_USER}
      PROD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      TEST_DB_USERNAME: ${POSTGRES_USER}
      TEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app_uploads:/app/uploads
      # 로그는 호스트에서 직접 접근 가능하도록 bind mount
      # (logrotate / scp 백업 / ELK forwarder 연계 용이)
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: photo-postgres:latest
    container_name: photo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: photo-redis
    restart: unless-stopped
    # JWT refresh / OAuth state 등 단기성 키만 사용하므로 영속화 불필요.
    # AOF/RDB 모두 비활성화하여 메모리 전용으로 동작.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  app_uploads:
