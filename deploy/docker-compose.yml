name: photo

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: photo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/well-known:/etc/nginx/well-known:ro
      - app_uploads:/var/www/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: ghcr.io/ddd-community/ddd-13-ioes-be:${APP_IMAGE_TAG:-dev-latest}
    container_name: photo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # test/prod 양쪽 yaml 이 같은 변수명을 읽도록 PROD_*/TEST_* 모두 주입
      PROD_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PROD_DB_USERNAME: ${POSTGRES_USER}
      PROD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      TEST_DB_USERNAME: ${POSTGRES_USER}
      TEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app_uploads:/app/uploads
      # 로그는 호스트에서 직접 접근 가능하도록 bind mount
      # (logrotate / scp 백업 / Promtail 연계 용이)
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgis/postgis:17-3.5
    container_name: photo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: photo-redis
    restart: unless-stopped
    # JWT refresh / OAuth state 등 단기성 키만 사용하므로 영속화 불필요.
    # AOF/RDB 모두 비활성화하여 메모리 전용으로 동작.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 모니터링 스택 ────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: photo-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    mem_limit: 512m
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: photo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      GF_SERVER_ROOT_URL: https://pickflow-api.us/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    networks:
      - backend
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.0
    container_name: photo-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    mem_limit: 256m
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.1.0
    container_name: photo-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/app:ro
      - /home/ubuntu/DDD-13-iOeS-BE/deploy/backup/logs:/var/log/backup:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    mem_limit: 128m
    networks:
      - backend
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: photo-node-exporter
    restart: unless-stopped
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 64m
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  app_uploads:
  prometheus_data:
  grafana_data:
  loki_data:
