server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: photo-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: photo-app
          service_name: photo-app
          __path__: /var/log/app/*.log

    pipeline_stages:
      # LogstashEncoder JSON 필드에서 저카디널리티 레이블만 추출
      # requestId/userId는 레이블이 아닌 JSON 필드로 쿼리 (| json | requestId="...")
      - json:
          expressions:
            level: level
      - labels:
          level:

  # dev 브랜치 테스트 서버 로그.
  # ⚠️ 운영과 반드시 다른 job 라벨을 쓴다. Loki 기반 알림 5종이 모두 {job="photo-app"}
  # 셀렉터를 사용하므로, 같은 라벨로 수집하면 테스트 서버의 에러가 운영 알림을 발생시킨다.
  - job_name: photo-app-dev-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: photo-app-dev
          service_name: photo-app-dev
          __path__: /var/log/app-dev/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:

  - job_name: backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: backup
          __path__: /var/log/backup/*.log

    pipeline_stages:
      # level(INFO/ERROR), type(db/applog) 을 저카디널리티 레이블로 추출
      - json:
          expressions:
            level: level
            type: type
      - labels:
          level:
          type:

  - job_name: maintenance
    static_configs:
      - targets:
          - localhost
        labels:
          job: maintenance
          __path__: /var/log/maintenance/*.log

    pipeline_stages:
      # level(INFO/WARN/ERROR), type(maintenance) 을 저카디널리티 레이블로 추출
      - json:
          expressions:
            level: level
            type: type
      - labels:
          level:
          type:

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service_name: nginx
          __path__: /var/log/nginx/*.log

    pipeline_stages:
      # error.log 라인의 [error]/[warn]/[crit] 레벨만 저카디널리티 레이블로 추출한다.
      # access.log 라인은 매칭되지 않아 레이블 없이 그대로 수집된다.
      - match:
          selector: '{job="nginx"}'
          stages:
            - regex:
                expression: '^\S+ \S+ \[(?P<level>\w+)\]'
            - labels:
                level: