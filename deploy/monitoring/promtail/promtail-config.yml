server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: photo-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: photo-app
          service_name: photo-app
          __path__: /var/log/app/*.log

    pipeline_stages:
      # LogstashEncoder JSON 필드 파싱
      - json:
          expressions:
            level: level
            requestId: requestId
            userId: userId
      # 레이블 지정
      # requestId/userId는 카디널리티가 높으나 요청 추적 용도로 유지
      - labels:
          level:
          requestId:
          userId:
      # output 미설정 → JSON 원본 전체를 Loki 로그 라인으로 저장
      # 이렇게 해야 stack_trace 등 모든 필드를 쿼리 시 | json 파이프로 파싱 가능
