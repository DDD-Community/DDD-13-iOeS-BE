apiVersion: 1

# 루트 notification policy를 프로비저닝하므로 UI에서 수정한 라우팅은 재시작 시 덮어써짐.
# 라우팅 변경은 반드시 이 파일에서 관리할 것.
policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # 데이터소스 장애/NoData(execErrState: Error, noDataState 로 발생하는 Grafana 내장 알림)는
      # 별도 그룹으로 묶어 과도한 반복을 억제한다.
      - receiver: discord-alerts
        matchers:
          - alertname =~ DatasourceError|DatasourceNoData|DatasourceMissing
        group_by: ['alertname', 'grafana_folder']
        repeat_interval: 4h
      - receiver: discord-alerts
        matchers:
          - severity = critical
        repeat_interval: 1h
