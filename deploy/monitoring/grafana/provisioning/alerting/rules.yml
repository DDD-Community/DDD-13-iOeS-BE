apiVersion: 1

groups:
  - orgId: 1
    name: app-error-alerts
    folder: Application
    interval: 1m
    rules:
      - uid: app-unhandled-500
        title: 미처리 500 에러
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'sum(count_over_time({job="photo-app", level="ERROR"} | json | logger_name="com.ioes.photo.global.error.handler.GlobalExceptionHandler" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: 미처리 예외(500)가 발생했습니다.
          description: GlobalExceptionHandler에서 Unexpected error가 감지되었습니다. Grafana Explore에서 {job="photo-app", level="ERROR"} 로그를 확인하세요.
        labels:
          severity: critical
        isPaused: false

      - uid: app-auth-infra-failure
        title: 인증 인프라 장애
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'sum(count_over_time({job="photo-app", level="ERROR"} |~ "Apple JWKS 조회 실패|Apple RSA 공개키 변환 실패|Apple identity token 검증 실패|Apple client_secret 생성 실패|닉네임/해시태그 충돌" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: 인증 인프라 오류가 발생했습니다.
          description: Apple JWKS 조회/공개키 변환/토큰 검증/OAuth 사용자 생성 실패가 감지되었습니다. 로그인 장애로 이어질 수 있습니다.
        labels:
          severity: critical
        isPaused: false

      - uid: app-scheduler-failure
        title: 수집 스케줄러 반복 실패
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'sum(count_over_time({job="photo-app", level="ERROR"} |= "unexpected failure" [30m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: 수집 스케줄러 실패가 반복되고 있습니다.
          description: 혼잡도/날씨/천문 수집 스케줄러 실패가 30분 내 2건 이상 발생했습니다. 데이터 수집이 중단되었을 수 있습니다.
        labels:
          severity: warning
        isPaused: false

      - uid: app-external-api-errors
        title: 외부 API 실패율 임계 초과
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'sum(count_over_time({job="photo-app", level="ERROR"} |~ "API 타임아웃|API 호출 실패|외부 API 5xx" [10m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: 외부 API 에러가 임계치를 초과했습니다.
          description: 외부 API(카카오/기상청/서울시/천문) 호출 실패가 10분 내 10건을 초과했습니다. 외부 서비스 장애 또는 키 만료 여부를 확인하세요.
        labels:
          severity: warning
        isPaused: false

  - orgId: 1
    name: infra-disk-alerts
    folder: Infra
    interval: 1m
    rules:
      - uid: infra-disk-usage-warning
        title: 디스크 사용률 경고 (85%)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 루트 디스크 사용률이 85%를 초과했습니다.
          description: EC2 루트(/) 디스크 사용률이 85%를 넘었습니다. cleanup-disk.sh 정리 로그({job="maintenance"})와 docker 이미지 누적 여부를 확인하세요.
        labels:
          severity: warning
        isPaused: false

      - uid: infra-disk-usage-critical
        title: 디스크 사용률 위험 (92%)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [92]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: KeepLast
        for: 1m
        annotations:
          summary: 루트 디스크 사용률이 92%를 초과했습니다. 즉시 조치가 필요합니다.
          description: EC2 루트(/) 디스크 사용률이 92%를 넘었습니다. 서비스 중단 위험이 있으니 즉시 cleanup-disk.sh 를 수동 실행하거나 디스크를 확보하세요.
        labels:
          severity: critical
        isPaused: false
