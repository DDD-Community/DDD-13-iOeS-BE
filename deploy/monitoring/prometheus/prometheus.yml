global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: photo

scrape_configs:
  - job_name: spring-boot-app
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100