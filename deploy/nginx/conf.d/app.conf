# ─────────────────────────────────────────────────────────────
# Photo 서비스 리버스 프록시
#
# Cloudflare(Edge SSL) → nginx(443, Cloudflare Origin Cert) → app:8080
# HTTP(80)은 HTTPS로 강제 리다이렉트
# ─────────────────────────────────────────────────────────────

upstream photo_app {
    server app:8080;
    keepalive 32;
}

upstream grafana_app {
    server grafana:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pickflow-api.us;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 슬로우로리스류 완화용 요청 타임아웃
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;

    # 공통 보안 헤더 (server 기본값). add_header를 두는 하위 location에서는
    # 상속이 끊기므로 각 location에서 스니펫을 다시 include 한다.
    include /etc/nginx/snippets/security-headers.conf;

    # 앱 상태 확인용 헬스체크 — 백엔드 actuator health를 실제로 프록시한다.
    location = /healthz {
        access_log off;
        proxy_pass http://photo_app/api/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        # 공유 링크(루트 토큰 경로)는 미리보기 크롤링이 필요하므로 전체 차단하지 않는다.
        return 200 "User-agent: *
Disallow: /api/
Disallow: /grafana/
Disallow: /uploads/
";
    }

    location = /favicon.ico {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        return 204;
    }

    location ^~ /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        access_log off;
        expires 7d;
        # 상속이 끊기므로 보안 헤더를 다시 선언한다.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        # 업로드 파일이 같은 오리진에서 서빙되므로, 업로드된 HTML/SVG가
        # 스크립트를 실행하지 못하도록 강한 CSP + 콘텐츠 스니핑 차단을 적용한다.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        # OG 미리보기 이미지가 외부(카카오 등)에서 임베드될 수 있어야 하므로 cross-origin 허용.
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # actuator 전체 외부 접근 차단.
    # Prometheus 컨테이너는 내부 네트워크(app:8080)로 직접 스크레이프하므로 영향이 없고,
    # 헬스 확인은 위의 /healthz 를 사용한다. test 프로필은 info/metrics 까지 노출하므로
    # prometheus 경로만 막던 기존 설정으로는 부족하다.
    # 끝 슬래시 없는 prefix 라 엔드포인트 목록을 반환하는 인덱스 경로(/api/actuator)까지 함께 막는다.
    # return(rewrite phase)이 deny(access phase)보다 먼저 실행되므로 deny 는 두지 않는다.
    location ^~ /api/actuator {
        return 403;
    }

    # iOS 유니버설 링크 검증용 AASA 파일 (정적 응답, 확장자 없음)
    # 애플 CDN이 application/json + 무리다이렉트로 조회하므로 nginx에서 직접 서빙
    location = /.well-known/apple-app-site-association {
        alias /etc/nginx/well-known/apple-app-site-association;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Android App Links 검증용 assetlinks.json (정적 응답, application/json 필수)
    location = /.well-known/assetlinks.json {
        alias /etc/nginx/well-known/assetlinks.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # 인증 엔드포인트: 브루트포스 완화용으로 더 낮은 rate 를 적용한다.
    # /api/ 보다 구체적인 prefix 이므로 ^~ 로 먼저 매칭시킨다.
    location ^~ /api/v1/auth/ {
        limit_req  zone=api_auth burst=20 nodelay;
        limit_conn conn_per_ip 50;
        client_max_body_size 1m;

        proxy_pass http://photo_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ^~ /api/ {
        limit_req  zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;
        # 업로드 경로가 /api/ 하위에 있어, 전역(2m)보다 상향한다.
        # 사진앱 고해상도 이미지 수용. 계층: app 50MB < 서블릿 60/70MB < nginx 75m
        client_max_body_size 75m;

        proxy_pass http://photo_app/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # /grafana → /grafana/ 정규화 (Grafana serve_from_sub_path 처리 위임)
    location = /grafana {
        return 301 /grafana/;
    }

    # Grafana 대시보드 — Grafana 자체 로그인으로 보호
    # proxy_pass 끝에 슬래시 없음: /grafana/ prefix를 유지하여 Grafana의 serve_from_sub_path 처리 위임
    location ^~ /grafana/ {
        limit_req  zone=grafana_login burst=20 nodelay;
        limit_conn conn_per_ip 50;

        proxy_pass http://grafana_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # 공유 링크(예: /k-U) → 백엔드 OG 미리보기 렌더링으로 프록시.
    # 백엔드가 토큰 디코딩·스팟 조회 후 OG 메타태그와 카카오톡 인앱 분기·스토어 유도를 응답.
    # 디코딩 실패·미존재·미공개 스팟은 백엔드가 기본 폴백 페이지로 응답.
    #
    # 토큰 형식({type}-{id})의 단일 세그먼트만 매칭한다. 다중 세그먼트(봇 스캔 등)를 넘기면
    # 백엔드에 대응 핸들러가 없어 500이 발생하므로 반드시 이 형태로 제한한다.
    # 정규식 location 은 /api/·/uploads/·/grafana/ 등 prefix location 보다 우선하지만,
    # 위 prefix들은 ^~ 로 선언해 정규식 평가 자체를 건너뛴다.
    location ~ ^/[0-9A-Za-z]+-[0-9A-Za-z]*$ {
        limit_req  zone=share_token burst=60 nodelay;
        limit_conn conn_per_ip 50;

        # 공유 링크는 조회 전용. 쓰기 메서드는 차단한다.
        limit_except GET HEAD {
            deny all;
        }

        # $request_uri(정규화 이전 원본) 대신 정규화된 $uri 를 사용해
        # //k-U, /./k-U 같은 비정규 경로가 그대로 백엔드에 전달되는 것을 막는다.
        proxy_pass http://photo_app/api/v1/share$uri$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # WAS 장애/오류 시 OG 정보 없이도 스토어 유도는 동작하도록 정적 인터스티셜로 폴백.
        # 500을 포함해, 백엔드 오류 JSON 바디가 크롤러에 노출되지 않도록 인터셉트한다.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @share_fallback;
    }

    # 루트 도메인 직접 접근 및 토큰 형식이 아닌 모든 경로는 정적 인터스티셜로 응답.
    location / {
        root /etc/nginx/html;
        try_files /share.html =404;
        charset utf-8;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location @share_fallback {
        root /etc/nginx/html;
        try_files /share.html =404;
        charset utf-8;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }
}

# ─────────────────────────────────────────────────────────────
# dev 브랜치 테스트 서버 (dev-api.pickflow-api.us)
#
# 운영과 같은 nginx·인증서를 재사용한다. Cloudflare Origin Cert 발급 시
# *.pickflow-api.us 를 포함해 두어 추가 발급이 필요 없다.
#
# 앱 팀 검증용이므로 API 와 Swagger 만 노출하고, 공유 링크 OG 렌더링·업로드 정적 서빙·
# Grafana 는 두지 않는다(운영 도메인에서만 제공).
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-api.pickflow-api.us;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;

    include /etc/nginx/snippets/security-headers.conf;

    # ⚠️ upstream 블록 대신 변수 + Docker 내장 DNS 를 쓴다.
    # upstream 에 app-dev 를 직접 적으면 컨테이너가 없을 때 nginx 가 기동 시점에
    # "host not found in upstream" 으로 기동 실패하고, 이는 운영 nginx 전체 장애가 된다.
    # 변수로 두면 요청 시점에 해석하므로 테스트 서버가 죽어도 502 만 응답한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        set $dev_upstream app-dev:8080;
        proxy_pass http://$dev_upstream/api/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
    }

    # 운영과 동일하게 actuator 는 외부 접근을 차단한다(인덱스 경로 포함).
    # Prometheus 는 내부 네트워크로 app-dev:8080 을 직접 스크레이프한다.
    # return(rewrite phase)이 deny(access phase)보다 먼저 실행되므로 deny 는 두지 않는다.
    location ^~ /api/actuator {
        return 403;
    }

    location ^~ /api/v1/auth/ {
        limit_req  zone=api_auth burst=20 nodelay;
        limit_conn conn_per_ip 50;
        client_max_body_size 1m;

        set $dev_upstream app-dev:8080;
        proxy_pass http://$dev_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ^~ /api/ {
        limit_req  zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 50;
        client_max_body_size 75m;

        # URI 를 붙이지 않아 원본 요청 경로가 그대로 전달된다.
        # (운영 블록의 proxy_pass .../api/ 는 /api/ 를 /api/ 로 치환하는 항등 동작이다.)
        set $dev_upstream app-dev:8080;
        proxy_pass http://$dev_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 테스트 서버는 API 외 경로를 제공하지 않는다.
    location / {
        return 404;
    }
}
