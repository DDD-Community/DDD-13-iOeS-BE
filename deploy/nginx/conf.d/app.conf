# ─────────────────────────────────────────────────────────────
# Photo 서비스 리버스 프록시
#
# Cloudflare(Edge SSL) → nginx(443, Cloudflare Origin Cert) → app:8080
# HTTP(80)은 HTTPS로 강제 리다이렉트
# ─────────────────────────────────────────────────────────────

upstream photo_app {
    server app:8080;
    keepalive 32;
}

upstream grafana_app {
    server grafana:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pickflow-api.us;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (운영 안정화 후 활성화)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Prometheus 메트릭 엔드포인트 외부 접근 차단
    # Prometheus 컨테이너는 내부 네트워크(app:8080)로 직접 스크레이프
    location = /api/actuator/prometheus {
        deny all;
        return 403;
    }

    location /api/ {
        proxy_pass http://photo_app/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Grafana 대시보드 — Grafana 자체 로그인으로 보호
    # proxy_pass 끝에 슬래시 없음: /grafana/ prefix를 유지하여 Grafana의 serve_from_sub_path 처리 위임
    location /grafana/ {
        proxy_pass http://grafana_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = / {
        return 404;
    }
}
