# ─────────────────────────────────────────────────────────────
# Photo 서비스 리버스 프록시
#
# - 초기 배포: HTTP(80)만 사용
# - TLS 적용 시: 아래 HTTPS 블록 주석 해제 + HTTP는 301 리다이렉트로 전환
# ─────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── TLS 적용 후: HTTPS로 강제 리다이렉트 (현재 주석) ───────────
    # return 301 https://$host$request_uri;

    # Let's Encrypt 인증 토큰 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 업로드 파일 정적 서빙 (S3 전환 전까지 임시)
    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Spring Boot API (context-path: /api)
    location /api/ {
        proxy_pass http://photo_app/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 루트는 별도 정적 페이지 없으면 /api/swagger-ui로 유도하거나 404
    location = / {
        return 404;
    }
}

