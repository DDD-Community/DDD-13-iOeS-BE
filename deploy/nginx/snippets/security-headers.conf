# 공통 보안 응답 헤더.
#
# ⚠️ nginx 상속 규칙: 하위 location 블록에 add_header가 하나라도 있으면
# 상위(server/http)의 add_header 선언을 "전부" 무시한다. 따라서 자체 add_header를
# 두는 모든 location에서 이 스니펫을 반드시 다시 include 해야 헤더가 누락되지 않는다.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Cloudflare(Edge)–origin 구간 강제. includeSubDomains는 하위 도메인 전체가 HTTPS일 때만 안전.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
