user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Cloudflare 실 IP 복원 (레이트 리밋 키가 실 클라이언트 IP가 되도록 제한보다 먼저 적용)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # 레이트 리밋 존 정의 (실제 제한은 각 location 에서 limit_req 로 적용)
    # ⚠️ 값은 초기 보수값이며, 운영 트래픽·캐리어 NAT 공유 IP를 고려해 튜닝 필요.
    limit_req_zone  $binary_remote_addr zone=api_general:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m      rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=grafana_login:10m rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=share_token:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # 전역 업로드 상한은 작게(대부분 JSON). 업로드가 있는 /api/ 에서만 별도 상향.
    client_max_body_size 2m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xml text/xml application/x-font-ttf
               font/opentype image/svg+xml image/x-icon;

    include /etc/nginx/conf.d/*.conf;
}
