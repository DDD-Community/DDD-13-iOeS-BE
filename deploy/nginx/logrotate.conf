# nginx 로그 로테이션. nginx 가 볼륨의 실제 파일에 기록하므로 호스트 logrotate 로 관리한다.
# 설치: sudo install -m 644 deploy/nginx/logrotate.conf /etc/logrotate.d/photo-nginx
# copytruncate 로 nginx 에 reopen 신호 없이 잘라내며, promtail 은 truncate 를 감지해 처음부터 다시 읽는다.
/var/lib/docker/volumes/photo_nginx_logs/_data/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
