spring:
  application:
    name: photo-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false

app:
  storage:
    type: s3
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    access-key: test-access-key
    secret-key: test-secret-key

  file:
    max-size: 1048576
    image-extensions: jpg,jpeg,png,gif,bmp,webp,svg,heic,heif

  image:
    thumbnail:
      width: 400
      height: 400
    presigned-url-expiry-minutes: 60

  app-config:
    ios:
      minimum-version: "1.0.0"
      latest-version: "1.0.0"
      force-update: false
      store-url: "https://apps.apple.com/app/id6761319884"
      support-email: "pickflow.help@gmail.com"
      terms-policies:
        - type: TERMS_OF_SERVICE
          title: "서비스 이용약관"
          url: "https://example.com/terms"
        - type: PRIVACY_POLICY
          title: "개인정보처리방침"
          url: "https://example.com/privacy"
    android:
      minimum-version: "1.0.0"
      latest-version: "1.0.0"
      force-update: false
      store-url: "https://play.google.com/store/apps/details?id=com.ioes.pickflow"
      support-email: "pickflow.help@gmail.com"
      terms-policies:
        - type: TERMS_OF_SERVICE
          title: "서비스 이용약관"
          url: "https://example.com/terms"
        - type: PRIVACY_POLICY
          title: "개인정보처리방침"
          url: "https://example.com/privacy"

  external-api:
    data-go-kr:
      base-url: https://apis.data.go.kr
      service-key: test-service-key
    seoul:
      base-url: http://openapi.seoul.go.kr:8088
      service-key: test-seoul-key

  http-client:
    connect-timeout: 5000
    read-timeout: 30000

  crowd:
    mapping:
      max-distance-meters: 3000

  share:
    base-url: https://pickflow-api.us

  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
    thread-name-prefix: "async-test-"

  security:
    public-urls:
      - /swagger-ui/**
      - /api-docs/**
      - /swagger-ui.html
      - /actuator/health
      - /auth/**

  swagger:
    title: "Photo API Test"
    version: "v1.0.0"
    description: "테스트용 API 명세"
    security-scheme-name: "Bearer Authentication"

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  token:
    refresh-expiration-ms: 3600000
    refresh-key-prefix: "refresh:"
    user-tokens-key-prefix: "userTokens:"
    provider-rt-key-prefix: "provider_rt:"

  oauth:
    kakao:
      client-id: test-kakao-id
      client-secret: test-kakao-secret
      redirect-uri: http://localhost/auth/oauth/kakao/callback
      admin-key: test-kakao-admin-key
    apple:
      client-id: com.test.app
      team-id: TEST1TEAM1
      key-id: TESTKEY123
      private-key: "test-private-key"
      redirect-uri: http://localhost/auth/oauth/apple/callback
      client-secret-ttl-ms: 600000

  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    max-age: 3600

  mdc:
    forwarded-ip-header: X-Forwarded-For
    request-log-excluded-paths:
      - /api/actuator
    keys:
      request-id: requestId
      user-id: userId
      request-uri: uri
      method: method
      client-ip: clientIp

logging:
  level:
    root: WARN
    com.ioes.photo: DEBUG

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ioes.photo.domain.spot.mapper,com.ioes.photo.domain.savedspot.mapper,com.ioes.photo.domain.myspot.mapper,com.ioes.photo.domain.statistics.mapper
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL