spring:
  application:
    name: photo
  config:
    import:
      - "classpath:config/dev/yaml/application-dev.yaml"
      - "optional:classpath:config/test/yaml/application-test.yaml"
      - "optional:classpath:config/prod/yaml/application-prod.yaml"
  servlet:
    multipart:
      # 실사용 경로는 단일 이미지 업로드(archive/profile/my-spot)뿐이다.
      # 배치 업로드(SpotAdminController)는 현재 비활성.
      # 사진앱 특성상 고해상도 이미지(파노라마/HEIC/RAW 등)를 수용하도록 여유 있게 설정.
      # 계층: app.file.max-size(50MB, 서비스 검증) < max-file-size(60MB) < max-request-size(70MB) < nginx /api/(75m)
      max-file-size: 60MB        # 단일 파일 상한. app.file.max-size보다 높게 두어 서비스 계층 검증이 도달 가능하게 함
      max-request-size: 70MB     # 폼 필드 포함 전체 요청 크기
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    out-of-order: false
    validate-on-migrate: true

# 파일 업로드
app:
  # 저장소 타입: s3 (MinIO 또는 AWS S3)
  storage:
    type: s3
    env: dev   # 각 프로필 yaml에서 반드시 override (dev/test/prod)

  # AWS S3 / MinIO 설정 (app.storage.type=s3 일 때 사용)
  s3:
    bucket: ${S3_BUCKET:photo-images}
    region: ${S3_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}          # MinIO: http://localhost:9000 / 실제 AWS: 빈 값
    access-key: ${S3_ACCESS_KEY:}        # MinIO: MINIO_ROOT_USER  / AWS: IAM Access Key
    secret-key: ${S3_SECRET_KEY:}        # MinIO: MINIO_ROOT_PASSWORD / AWS: IAM Secret Key
    # CloudFront 배포 도메인 (예: d1234567890.cloudfront.net)
    # 설정 시 public 콘텐츠는 만료 없는 CloudFront URL로 제공됩니다.
    # 미설정 시 모든 콘텐츠는 Presigned URL로 제공됩니다.
    cloud-front-domain: ${CLOUDFRONT_DOMAIN:}
    # CloudFront 배포 ID — 캐시 무효화(이미지 교체/삭제 시)에 사용.
    # 설정 시 CloudFrontClient 빈이 생성되어 무효화가 활성화됩니다.
    distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID:}

  # 이미지 처리 설정
  image:
    thumbnail:
      width: 300      # 썸네일 최대 가로 픽셀 (비율 유지) - 아이폰 @3x 마커 기준
      height: 300     # 썸네일 최대 세로 픽셀 (비율 유지)
    presigned-url-expiry-minutes: 60   # Presigned URL 유효 시간(분)

  file:
    # 서비스 계층 이미지 상한. 서블릿 max-file-size(60MB)보다 낮아야 FileUtils.validateSize가
    # 실제로 동작한다(둘이 같으면 서블릿이 먼저 413을 던져 이 검증이 도달 불가).
    # 고해상도 사진 업로드를 고려해 여유 있게 50MB로 설정.
    max-size: 52428800          # 50MB (bytes)
    image-extensions: jpg,jpeg,png,gif,bmp,webp,svg,heic,heif

  # 외부 API
  external-api:
    data-go-kr:
      base-url: https://apis.data.go.kr
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
    seoul:
      base-url: http://openapi.seoul.go.kr:8088
      service-key: ${SEOUL_API_KEY:}

  # HTTP 클라이언트
  http-client:
    connect-timeout: 5000       # ms
    read-timeout: 30000         # ms

  # 스팟 부가정보(날씨/천문/혼잡도) 수집 스위치.
  # false 로 두면 수집 스케줄러와 기동 시 초기 수집 빈이 생성되지 않는다.
  # 운영과 외부 API 서비스키를 공유하는 환경(테스트 서버)에서 호출량이 두 배가 되어
  # 일일 트래픽 한도를 소진하는 것을 막기 위한 설정이다.
  spotinfo:
    collect:
      enabled: true

  # 기상청 단기예보 수집
  weather:
    # 발표 시각으로부터 조회 가능해지기까지 지연(분). 운영 중 실측에 따라 조정 가능.
    availability-delay-minutes: 10

  # 스팟 → 혼잡도 장소 자동 매핑
  crowd:
    mapping:
      # 최근접 장소까지 이 거리(m)를 초과하면 매핑하지 않음. PM 협의로 조정 가능.
      max-distance-meters: 3000

  # 앱 버전 설정 — 버전 정책 변경 시 이 값을 수정 후 배포
  app-config:
    ios:
      minimum-version: "1.0.0"   # 이 버전 미만이면 앱 사용 불가
      latest-version: "1.0.0"    # 앱스토어 기준 최신 버전
      force-update: false        # 강제 업데이트 기능 on/off 스위치
      store-url: "https://apps.apple.com/app/id6761319884"
      support-email: "pickflow.help@gmail.com"
      terms-policies:
        - type: TERMS_OF_SERVICE
          title: "서비스 이용약관"
          url: "https://cubic-print-1cb.notion.site/abe90976df958360b53001e6ee774eb3?pvs=143"
        - type: LOCATION_TERMS
          title: "위치정보 서비스 이용약관"
          url: "https://cubic-print-1cb.notion.site/36390976df9580289cc9ebcba9ed7ffd?pvs=143"
        - type: PRIVACY_POLICY
          title: "개인정보처리방침"
          url: "https://cubic-print-1cb.notion.site/07a90976df958319b6d1013e089c5ee6?pvs=143"
    android:
      minimum-version: "1.0.0"   # 이 버전 미만이면 앱 사용 불가
      latest-version: "1.0.0"    # 플레이스토어 기준 최신 버전
      force-update: false        # 강제 업데이트 기능 on/off 스위치
      store-url: "https://play.google.com/store/apps/details?id=com.pickflow.app"
      support-email: "pickflow.help@gmail.com"
      terms-policies:
        - type: TERMS_OF_SERVICE
          title: "서비스 이용약관"
          url: "https://cubic-print-1cb.notion.site/abe90976df958360b53001e6ee774eb3?pvs=143"
        - type: LOCATION_TERMS
          title: "위치정보 서비스 이용약관"
          url: "https://cubic-print-1cb.notion.site/36390976df9580289cc9ebcba9ed7ffd?pvs=143"
        - type: PRIVACY_POLICY
          title: "개인정보처리방침"
          url: "https://cubic-print-1cb.notion.site/07a90976df958319b6d1013e089c5ee6?pvs=143"

  # 공유 링크
  share:
    base-url: ${SHARE_BASE_URL:https://pickflow-api.us}   # og:url 생성용 외부 도메인

  # 노션 운영 지표 동기화 (매일 06시) — 미설정 시 스케줄러 스킵
  notion:
    token: ${NOTION_TOKEN:}
    database-id: ${NOTION_DATABASE_ID:}

  # 비동기 스레드 풀
  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 100
    thread-name-prefix: "async-exec-"

  # Security 허용 경로
  security:
    public-urls:
      - /swagger-ui/**
      - /api-docs/**
      - /swagger-ui.html
      - /actuator/health
      - /v1/auth/kakao
      - /v1/auth/apple
      - /v1/auth/refresh
      - /v1/users/restore
    # GET 요청에 한해 비로그인 허용 — 같은 경로의 비-GET(예: POST 신고)은 인증 유지
    public-get-urls:
      - /v1/spots
      - /v1/spots/**
      - /v1/regions
      - /v1/regions/**
      - /v1/bbs/posts
      - /v1/bbs/posts/**
      - /v1/address/**
      - /v1/app/config/**
      - /v1/share/**

  # CORS 허용 (어드민 웹 도메인) — Origin은 스킴+호스트+포트만, 끝 슬래시/경로 불가
  # 어드민 프론트는 모든 환경(운영 포함)의 서버를 보고 로컬 개발하므로 localhost도 전 프로필 공통 허용.
  # 자격증명 미전송(allowCredentials 미설정=false)이라 브라우저가 쿠키/Authorization 을 자동으로 싣지 않는다.
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://pickflow-admin.vercel.app
      - https://pickflow-admin-demo.vercel.app
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    max-age: 3600

  #  Swagger / OpenAPI
  swagger:
    title: "Photo API"
    version: "v1.0.0"
    description: "Photo 서비스 API 명세서"
    security-scheme-name: "Bearer Authentication"

  # 닉네임 자동 생성
