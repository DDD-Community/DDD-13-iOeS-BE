spring:
  application:
    name: photo
  config:
    import:
      - "classpath:config/dev/yaml/application-dev.yaml"
      - "optional:classpath:config/test/yaml/application-test.yaml"
      - "optional:classpath:config/prod/yaml/application-prod.yaml"

# 파일 업로드
app:
  file:
    upload-dir: uploads
    max-size: 10485760          # 10MB (bytes)
    image-extensions: jpg,jpeg,png,gif,bmp,webp,svg,heic,heif,exif

  # 외부 API
  external-api:
    data-go-kr:
      base-url: https://apis.data.go.kr
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
    seoul:
      base-url: http://openapi.seoul.go.kr:8088
      service-key: ${SEOUL_API_KEY:}

  # HTTP 클라이언트
  http-client:
    connect-timeout: 5000       # ms
    read-timeout: 30000         # ms

  # 비동기 스레드 풀
  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 100
    thread-name-prefix: "async-exec-"

  # Security 허용 경로
  security:
    public-urls:
      - /swagger-ui/**
      - /api-docs/**
      - /swagger-ui.html
      - /actuator/health
      - /auth/**

  #  Swagger / OpenAPI
  swagger:
    title: "Photo API"
    version: "v1.0.0"
    description: "Photo 서비스 API 명세서"
    security-scheme-name: "Bearer Authentication"

  # JWT
  jwt:
    # 운영 환경에서는 반드시 환경 변수 JWT_SECRET 으로 주입 (256 bit 이상 Base64 인코딩)
    secret: ${JWT_SECRET}
    expiration-ms: 86400000     # 24h

  # MDC 키 이름 (logback 패턴의 %X{키이름}과 반드시 일치)
  mdc:
    forwarded-ip-header: X-Forwarded-For
    keys:
      request-id: requestId
      user-id: userId
      request-uri: uri
      method: method
      client-ip: clientIp

# 로깅 공통
logging:
  file:
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
