      - "설표"
      - "눈표범"
      - "흰늑대"
      - "산양"
    hashtag:
      min: 1
      max: 99999
      max-attempts: 5

  # JWT
  jwt:
    # 운영 환경에서는 반드시 환경 변수 JWT_SECRET 으로 주입 (256 bit 이상 Base64 인코딩)
    secret: ${JWT_SECRET}
    expiration-ms: 86400000     # 24h

  # Refresh Token
  token:
    refresh-expiration-ms: 1209600000  # 14일
    refresh-key-prefix: "refresh:"
    user-tokens-key-prefix: "userTokens:"
    provider-rt-key-prefix: "provider_rt:"
    blacklist-key-prefix: "blacklist:"
    restore-token-expiration-ms: 300000  # 5분

  # MDC 키 이름 (logback 패턴의 %X{키이름}과 반드시 일치)
  mdc:
    forwarded-ip-header: X-Forwarded-For
    keys:
      request-id: requestId
      user-id: userId
      request-uri: uri
      method: method
      client-ip: clientIp

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ioes.photo.domain.spot.mapper,com.ioes.photo.domain.savedspot.mapper
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

# 로깅 공통
logging:
  file:
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
