spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # 운영과 같은 Redis 인스턴스를 공유하므로 논리 DB 를 분리한다.
      # 토큰 키 prefix(refresh:/blacklist: 등)가 프로필과 무관하게 동일해,
      # 같은 DB 를 쓰면 같은 유저의 리프레시 토큰이 서로 덮어써진다.
      database: 1
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://postgres:5432/photo}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  docker:
    compose:
      enabled: false

app:
  storage:
    env: test

  # 운영과 외부 API 서비스키를 공유하므로 테스트 서버에서는 수집을 돌리지 않는다.
  # 켜야 할 경우 dev 전용 서비스키를 발급받아 .env 에 주입한 뒤 true 로 변경한다.
  spotinfo:
    collect:
      enabled: false

  jwt:
    secret: ${JWT_SECRET}

  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      admin-key: ${KAKAO_ADMIN_KEY}
    apple:
      client-id: ${APPLE_CLIENT_ID}
      team-id: ${APPLE_TEAM_ID}
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}
      client-secret-ttl-ms: 600000

  security:
    public-urls:
      - /swagger-ui/**
      - /api-docs/**
      - /swagger-ui.html
      - /actuator/**
      - /v1/auth/kakao
      - /v1/auth/apple
      - /v1/auth/refresh
      - /v1/users/restore
      - /v1/internal/**
    public-get-urls:
      - /v1/spots
      - /v1/spots/**
      - /v1/bbs/posts
      - /v1/bbs/posts/**
      - /v1/address/**

logging:
  config: classpath:config/test/logback/logback-test.xml
  file:
    path: /app/logs

server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true
