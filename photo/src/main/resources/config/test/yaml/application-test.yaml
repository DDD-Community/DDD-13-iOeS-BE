spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://postgres:5432/photo}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  docker:
    compose:
      enabled: false

app:
  storage:
    env: test

  jwt:
    secret: ${JWT_SECRET}

  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      admin-key: ${KAKAO_ADMIN_KEY}
    apple:
      client-id: ${APPLE_CLIENT_ID}
      team-id: ${APPLE_TEAM_ID}
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}
      client-secret-ttl-ms: 600000

  # 프로필별 목록은 병합이 아니라 전체 치환이므로, 공통 application.yaml 목록을 그대로 옮겨 적고
  # 테스트 서버에만 필요한 항목을 더한다. public-get-urls 는 공통 목록과 동일해 재정의하지 않는다.
  security:
    public-urls:
      - /swagger-ui/**
      - /api-docs/**
      - /swagger-ui.html
      - /actuator/health
      # Prometheus 컨테이너가 내부 네트워크로 스크레이프한다. 외부 접근은 nginx 에서 차단.
      - /actuator/prometheus
      - /v1/auth/kakao
      - /v1/auth/apple
      - /v1/auth/refresh
      - /v1/users/restore

logging:
  config: classpath:config/test/logback/logback-test.xml
  file:
    path: /app/logs

server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: native

management:
  endpoints:
    web:
      # env 는 서버 환경 프로퍼티를 그대로 반환하므로 노출하지 않는다.
      # info/metrics 는 노출하되 public-urls 에 없어 인증된 요청만 접근 가능하다.
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # health 는 비로그인 허용이라 always 로 두면 DB/Redis 연결 상태와 오류 메시지가 그대로 공개된다.
      # 인증된 요청에만 상세를 노출해 디버깅 편의는 유지한다.
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true
